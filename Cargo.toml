[package]
name = "keystone-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
thiserror = "1.0"
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "identify", "ping", "kad", "mdns", "request-response", "json", "tokio", "macros"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
